# Compiles the app the way an iPhone build does, on GitHub's runners.
#
# Budget notes — this repo is public, so standard GitHub-hosted runners are
# not billed to anyone here, and the 10x macOS multiplier named throughout
# these files costs nothing at the moment. It is still written down, because
# it is what a fork pays the moment one goes private, and because the ratio is
# the honest measure of what a macOS job costs relative to a Linux one.
#
# What is spent either way is wall clock: one full build of this project runs
# roughly 15 minutes, and a macOS runner can wait in a queue before it starts
# where a Linux one does not. Everything below is arranged around that, and
# holds whoever is paying:
#
#   * the workflow only ever runs when someone presses "Run workflow"; there
#     is no push or schedule trigger, so no commit can start a macOS run;
#   * a Linux job at the 1x rate regenerates the native project first, so a
#     broken app.json or config plugin fails in ~1 minute instead of ~15;
#   * concurrency cancels superseded runs, and timeouts cap a hung build.
#
# The build targets the simulator with signing off, so it needs no Apple
# Developer account and no secrets. It answers "does this still compile for
# iOS", not "here is an installable .ipa" — device builds need a paid account
# and certificates in secrets.

name: iOS build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode build configuration
        type: choice
        options: [Debug, Release]
        default: Debug

permissions:
  contents: read

# A newer manual run on the same ref makes the running build irrelevant; stop
# spending a runner on it.
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  prebuild-check:
    name: Generate native project (Linux, 1x)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # --legacy-peer-deps matches .devcontainer/devcontainer.json; the
      # onnxruntime and react 19 peer ranges do not resolve without it.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      # A patch that never reached node_modules produces a binary
      # indistinguishable from one where the fix did not work — which has
      # already cost a release cycle. `--error-on-fail` in postinstall catches
      # a patch that fails to apply; this catches the case where postinstall
      # never ran at all, and it runs before anything expensive so it fails at
      # the 1x rate.
      #
      # Every line here stays indented under the block scalar. A heredoc body
      # at column zero ends the scalar and makes the whole workflow file
      # invalid YAML, which GitHub reports as a failed run against the push
      # rather than as a syntax error.
      - name: Verify native patches reached node_modules
        run: |
          set -euo pipefail
          missing=0
          require() {
            if ! grep -q "$2" "$1"; then
              echo "::error::$1 has no '$2', so patches/ did not reach node_modules"
              missing=1
            fi
          }
          require node_modules/expo-camera/ios/Current/CameraPhotoCapture.swift describeCaptureFailure
          require node_modules/expo-camera/ios/Current/CameraPhotoCapture.swift retriedWithPlainSettings
          require node_modules/expo-camera/ios/Current/CameraSessionManager.swift disableDeferredPhotoDelivery
          require node_modules/expo-camera/ios/Current/CameraSessionManager.swift observeInterruptions
          require node_modules/expo-camera/ios/Current/CameraPhotoCapture.swift lastInterruption
          require node_modules/expo-camera/ios/Current/CameraSessionManager.swift startRunningPersistently
          require node_modules/expo-camera/ios/Current/CameraView.swift readinessObservation
          require node_modules/expo-camera/ios/Common/CameraExceptions.swift CameraImageCaptureDetailedException
          if [ "$missing" -ne 0 ]; then
            echo "::error::Refusing to build, the camera fix is not in the sources CocoaPods compiles"
            exit 1
          fi
          echo "Native patches present in node_modules."

      # ios/ is generated, never committed. This resolves every config plugin
      # in app.json and writes the Xcode project; --no-install skips the
      # CocoaPods step, which needs macOS.
      - name: expo prebuild
        run: npx expo prebuild --platform ios --clean --no-install

  build:
    name: xcodebuild (macOS, 10x)
    needs: prebuild-check
    # macos-26 is the current GA arm64 image and bills at the same 10x standard
    # rate as macos-15 (macos-26-xlarge is the pricier SKU; this is not it). Not
    # macos-latest: that alias migrates between images over a 1-2 month window,
    # and an unannounced toolchain change is the last thing a 10x job needs.
    runs-on: macos-26
    # Hard stop: a wedged build must not sit on a macOS runner for hours.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # expo-modules-core builds ExpoModulesJSI through SwiftPM, and one of that
      # package's dependencies declares swift-tools-version 6.2, so the build
      # dies at package resolution on anything older than Xcode 26. This image
      # already defaults to a 26.x, so the step is a pin rather than a fix: it
      # holds the build on the 26 line, so that when the image's default moves
      # to Xcode 27 that becomes a deliberate edit here instead of a surprise
      # in a 10x job. Set before CocoaPods runs so pod install and xcodebuild
      # agree on a single toolchain.
      - name: Select Xcode 26 (Swift 6.2)
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)" || true
          if [ -z "${xcode:-}" ]; then
            echo "::error::No Xcode 26 on this runner image. ExpoModulesJSI needs Swift 6.2; if the image has moved on to Xcode 27, widen the glob above after checking Expo supports it."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          "$xcode/Contents/Developer/usr/bin/xcodebuild" -version

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      # A patch that never reached node_modules produces a binary
      # indistinguishable from one where the fix did not work — which has
      # already cost a release cycle. `--error-on-fail` in postinstall catches
      # a patch that fails to apply; this catches the case where postinstall
      # never ran at all, and it runs before anything expensive so it fails at
      # the 1x rate.
      #
      # Every line here stays indented under the block scalar. A heredoc body
      # at column zero ends the scalar and makes the whole workflow file
      # invalid YAML, which GitHub reports as a failed run against the push
      # rather than as a syntax error.
      - name: Verify native patches reached node_modules
        run: |
          set -euo pipefail
          missing=0
          require() {
            if ! grep -q "$2" "$1"; then
              echo "::error::$1 has no '$2', so patches/ did not reach node_modules"
              missing=1
            fi
          }
          require node_modules/expo-camera/ios/Current/CameraPhotoCapture.swift describeCaptureFailure
          require node_modules/expo-camera/ios/Current/CameraPhotoCapture.swift retriedWithPlainSettings
          require node_modules/expo-camera/ios/Current/CameraSessionManager.swift disableDeferredPhotoDelivery
          require node_modules/expo-camera/ios/Current/CameraSessionManager.swift observeInterruptions
          require node_modules/expo-camera/ios/Current/CameraPhotoCapture.swift lastInterruption
          require node_modules/expo-camera/ios/Current/CameraSessionManager.swift startRunningPersistently
          require node_modules/expo-camera/ios/Current/CameraView.swift readinessObservation
          require node_modules/expo-camera/ios/Common/CameraExceptions.swift CameraImageCaptureDetailedException
          if [ "$missing" -ne 0 ]; then
            echo "::error::Refusing to build, the camera fix is not in the sources CocoaPods compiles"
            exit 1
          fi
          echo "Native patches present in node_modules."

      - name: expo prebuild
        run: npx expo prebuild --platform ios --clean --no-install

      # Only the download cache, not ios/Pods: saving a multi-gigabyte Pods
      # directory happens on this runner, and that upload time is billed at
      # 10x too. The tarballs (hermes-engine, the prebuilt React Native
      # frameworks) are the slow part and they live here.
      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: pods-${{ runner.os }}-

      # EXPO_USE_SOURCE=1 takes the source branch of every Expo podspec's
      # `vendored_frameworks` switch. A prebuilt XCFramework next to a podspec
      # wins over the .swift files beside it, and patches/ only edits the .swift
      # files — so a precompiled pod is a patch that applies, passes every
      # check, changes the fingerprint, and changes nothing that runs.
      - name: pod install
        working-directory: ios
        env:
          EXPO_USE_SOURCE: '1'
          EXPO_USE_PRECOMPILED_MODULES: '0'
        run: pod install

      # And then prove it, because "in theory the sources are compiled" is what
      # the last three builds were built on. This reports how ExpoCamera was
      # actually integrated and fails if the patched source is not what Xcode
      # will compile.
      - name: Prove the patched camera source is what gets compiled
        working-directory: ios
        run: |
          set -euo pipefail
          echo "--- Podfile.lock entry"
          grep -n "ExpoCamera" Podfile.lock || true
          echo "--- any XCFramework in the pod"
          find Pods -maxdepth 3 -name "*.xcframework" -print || true
          echo "--- how the pod resolves"
          if [ -e Pods/ExpoCamera ]; then ls -la Pods/ExpoCamera || true; fi
          echo "--- does the Pods project reference the patched source?"
          if ! grep -q "CameraPhotoCapture.swift" Pods/Pods.xcodeproj/project.pbxproj; then
            echo "::error::Pods project does not compile CameraPhotoCapture.swift, so patches/ cannot take effect"
            exit 1
          fi
          if find Pods -maxdepth 3 -name "ExpoCamera.xcframework" | grep -q .; then
            echo "::error::ExpoCamera is linked as a prebuilt XCFramework, so the patched Swift is not compiled"
            exit 1
          fi
          echo "ExpoCamera compiles from the patched sources."

      # Simulator + CODE_SIGNING_ALLOWED=NO keeps this free of certificates and
      # provisioning profiles. Workspace and scheme are derived from the name
      # in app.json, so renaming the app does not break this step.
      - name: Build
        run: |
          set -euo pipefail
          workspace="$(ls -d ios/*.xcworkspace | head -1)"
          scheme="$(basename "$workspace" .xcworkspace)"
          echo "Building $scheme (${{ inputs.configuration || 'Debug' }})"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration "${{ inputs.configuration || 'Debug' }}" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build
