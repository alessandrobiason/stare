name: Pages
'on':
  push:
    branches:
    - main
    paths:
    - 'site/**'
    - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy support and privacy pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Check the pages link to each other
      run: |
        cd site
        status=0
        for page in *.html; do
          while read -r target; do
            [ -f "$target" ] || { echo "$page -> $target is missing"; status=1; }
          done < <(grep -o 'href="[^"#:]*\.\(html\|css\)"' "$page" | sed 's/href="//;s/"$//')
        done
        exit $status
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: site
    - id: deployment
      uses: actions/deploy-pages@v4
