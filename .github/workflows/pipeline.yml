# One pipeline: Check -> fresh App Store screenshots -> manually requested publishing.
# Every checkout is pinned to this run's SHA; no release can borrow another run's gates.
# Pushes and PRs validate only. Manual release runs repeat both gates before publishing.
# CI runs may supersede each other; manual runs and publishing jobs are never interrupted.
# Screenshot success means fresh captures and valid output for the complete listing,
# not byte equality with committed PNGs (the map and browser rasterisation can vary).
# The TestFlight offset preserves numbering: the former workflow reached run 48 + 14 = 62.

name: Pipeline
run-name: ${{ inputs.operation || 'validate' }} · ${{ github.ref_name }}
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch:
    inputs:
      operation:
        description: Validate, publish, or run a maintenance task. Every choice runs Check and screenshots first.
        type: choice
        options:
        - validate
        - testflight
        - ota
        - screenshots
        - ios-build
        default: validate
      configuration:
        description: Xcode configuration for TestFlight or simulator builds
        type: choice
        options:
        - Release
        - Debug
        default: Release
      ota_branch:
        description: EAS update branch (OTA only)
        type: string
        default: production
      message:
        description: What this update changes (required for OTA)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: pipeline-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
env:
  EXPO_NO_TELEMETRY: '1'
jobs:
  check:
    name: Stage 1 · Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Validate the requested operation
      env:
        OPERATION: ${{ inputs.operation }}
        OTA_BRANCH: ${{ inputs.ota_branch }}
        OTA_MESSAGE: ${{ inputs.message }}
      run: |
        set -euo pipefail
        if [ "$OPERATION" = ota ]; then
          if [ -z "${OTA_MESSAGE//[[:space:]]/}" ] || [ -z "${OTA_BRANCH//[[:space:]]/}" ]; then
            echo "::error::OTA requires a message and an EAS branch."
            exit 1
          fi
        fi
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm
    - name: Install dependencies
      run: npm ci --legacy-peer-deps --no-audit --no-fund
    - name: Check
      run: npm run check
  screenshots:
    name: Stage 2 · App Store screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm
    - name: Install dependencies
      run: npm ci --legacy-peer-deps --no-audit --no-fund
    - name: Install Chromium
      run: npx playwright install --with-deps chromium
    - name: Check timeline touch gestures
      run: npx playwright test -c testing/gestures/playwright.config.ts
    - name: Cache the background photographs
      uses: actions/cache@v4
      with:
        path: tools/screenshots/backgrounds
        key: screenshot-backgrounds-${{ hashFiles('tools/screenshots/backgrounds.mjs') }}
    - name: Fetch the background photographs
      run: node tools/screenshots/backgrounds.mjs
    - name: Cache the sky model
      id: model
      uses: actions/cache@v4
      with:
        path: public/skywater.onnx
        key: skywater-model-${{ hashFiles('src/vision/skyModelSource.ts') }}
    - name: Fetch the sky model
      if: steps.model.outputs.cache-hit != 'true'
      run: |
        mkdir -p public
        url=$(node -e "process.stdout.write(require('fs').readFileSync('src/vision/skyModelSource.ts','utf8').match(/\"(https:[^\"]+\.onnx)\"/)[1])")
        echo "fetching $url"
        curl -sSL --retry 3 -o public/skywater.onnx "$url"
    - name: Capture the app and compose the frames
      run: |
        node tools/screenshots/capture.mjs
        node tools/screenshots/render.mjs
    - name: Validate the full screenshot set
      run: |
        node tools/ci/check-screenshots.mjs
        printf '%s\n' "$GITHUB_SHA" > docs/app-store/source-commit.txt
        {
          echo "### App Store screenshots passed"
          echo "All languages and both sizes were captured and composed from commit $GITHUB_SHA."
          echo "Download app-store-screenshots from this run to review them."
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload the frames
      uses: actions/upload-artifact@v4
      with:
        name: app-store-screenshots
        path: docs/app-store
        if-no-files-found: error
    needs: check
  native-preflight:
    name: Stage 3 · Native preflight (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
    - name: Check the bundled TLE catalogue is fresh
      run: node tools/check-bundled-tle.mjs
      if: inputs.operation == 'testflight'
    - name: Check the release secrets
      env:
        TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
        CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
        KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        PROFILE_BASE64: ${{ secrets.APPLE_DIST_PROFILE_BASE64 }}
      run: |
        set -euo pipefail

        fail() {
          echo "::error::$1 See the secrets table in docs/ios-builds.md."
          exit 1
        }

        for pair in "APPLE_TEAM_ID:${TEAM_ID:-}" \
                    "APPLE_DIST_CERT_P12_BASE64:${CERT_P12_BASE64:-}" \
                    "APPLE_DIST_CERT_PASSWORD:${CERT_PASSWORD:-}" \
                    "APPSTORE_KEY_ID:${KEY_ID:-}" \
                    "APPSTORE_ISSUER_ID:${ISSUER_ID:-}" \
                    "APPSTORE_API_KEY_P8_BASE64:${API_KEY_P8_BASE64:-}" \
                    "APPLE_DIST_PROFILE_BASE64:${PROFILE_BASE64:-}"; do
          [ -n "${pair#*:}" ] || fail "Repository secret ${pair%%:*} is empty or not set."
        done

        # Both IDs are plain alphanumeric, so anything else in them is stray
        # whitespace or a smart quote picked up on the way through a paste.
        case "$TEAM_ID" in *[![:alnum:]]*)
          fail "APPLE_TEAM_ID holds a character that is not a letter or digit." ;; esac
        case "$KEY_ID" in *[![:alnum:]]*)
          fail "APPSTORE_KEY_ID holds a character that is not a letter or digit." ;; esac

        # The same normalising the 10x job does, so what passes here is what
        # it will get: whitespace out of the base64, then CRs out of the PEM.
        key="$RUNNER_TEMP/authkey.p8"
        printf '%s' "$API_KEY_P8_BASE64" | tr -d '[:space:]' | base64 -d 2>/dev/null \
          | tr -d '\r' > "$key" || true
        # The message stays one line: only the first reaches the annotation.
        openssl pkey -in "$key" -noout 2>/dev/null \
          || fail "APPSTORE_API_KEY_P8_BASE64 does not decode to a PEM private key -- it is 'base64 -w0 < AuthKey_XXXXXXXXXX.p8', not the .p8 text."
        rm -f "$key"

        # The profile is not negotiable at build time -- manual signing uses
        # this one or fails -- so it is checked against what the app actually
        # builds. A .mobileprovision is a CMS blob wrapped around a plist.
        bundle="$(python3 -c 'import json; print(json.load(open("app.json"))["expo"]["ios"]["bundleIdentifier"])')"
        profile="$RUNNER_TEMP/dist.mobileprovision"
        plist="$RUNNER_TEMP/profile.plist"
        printf '%s' "$PROFILE_BASE64" | tr -d '[:space:]' | base64 -d 2>/dev/null > "$profile" || true
        openssl smime -verify -inform DER -noverify -in "$profile" -out "$plist" 2>/dev/null \
          || fail "APPLE_DIST_PROFILE_BASE64 does not decode to a provisioning profile -- it is 'base64 -w0 < Stare.mobileprovision' as downloaded from developer.apple.com."
        python3 tools/check-ios-profile.py "$plist" "$bundle" "$TEAM_ID"
        rm -f "$profile" "$plist"

        echo "All seven release secrets are present and usable."
      if: inputs.operation == 'testflight'
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm
    - name: Install dependencies
      run: npm ci --legacy-peer-deps --no-audit --no-fund
    - name: Verify native patches reached node_modules
      run: bash tools/ci/verify-native-patches.sh
    - name: expo prebuild
      run: npx expo prebuild --platform ios --clean --no-install
    - name: Check app icon has no alpha channel
      run: node tools/check-icon-opaque.mjs
    - name: Check the update configuration
      run: node tools/check-eas-updates.mjs
    - name: Report the runtime version
      run: |
        set -euo pipefail
        runtime="$(npx expo-updates runtimeversion:resolve --platform ios \
          | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).runtimeVersion')"
        {
          echo "### iOS ${{ inputs.configuration || 'Release' }} build"
          echo
          echo "| | |"
          echo "|---|---|"
          echo "| Runtime version | \`$runtime\` |"
          echo "| Commit | \`${{ github.sha }}\` |"
          echo
          echo "An OTA update reaches this build only while \`npm run runtime-version\`"
          echo "still prints \`$runtime\`. When it stops, the change is a native one and"
          echo "needs another run of this workflow."
        } >> "$GITHUB_STEP_SUMMARY"
        echo "Runtime version: $runtime"
    needs:
    - check
    - screenshots
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'testflight' || inputs.operation == 'ios-build')
  testflight:
    name: Stage 3 · iOS TestFlight (manual)
    needs:
    - check
    - screenshots
    - native-preflight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUILD_NUMBER_OFFSET: 62
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
    - name: Compute the build number
      run: |
        set -euo pipefail
        echo "BUILD_NUMBER=$(( ${{ github.run_number }} + BUILD_NUMBER_OFFSET )).${{ github.run_attempt }}" \
          >> "$GITHUB_ENV"
    - name: Select Xcode 26 (Swift 6.2)
      run: |
        set -euo pipefail
        xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)" || true
        if [ -z "${xcode:-}" ]; then
          echo "::error::No Xcode 26 on this runner image. ExpoModulesJSI needs Swift 6.2; if the image has moved on to Xcode 27, widen the glob above after checking Expo supports it."
          ls -d /Applications/Xcode*.app || true
          exit 1
        fi
        echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
        "$xcode/Contents/Developer/usr/bin/xcodebuild" -version
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm
    - name: Install dependencies
      run: npm ci --legacy-peer-deps --no-audit --no-fund
    - name: Verify native patches reached node_modules
      run: bash tools/ci/verify-native-patches.sh
    - name: Stamp the build number into app.json
      run: |
        set -euo pipefail
        node -e '
          const fs = require("fs");
          const config = JSON.parse(fs.readFileSync("app.json", "utf8"));
          config.expo.ios.buildNumber = process.env.BUILD_NUMBER;
          fs.writeFileSync("app.json", JSON.stringify(config, null, 2) + "\n");
        '
        echo "Build $BUILD_NUMBER of version $(node -p 'require("./app.json").expo.version')"
    - name: expo prebuild
      run: npx expo prebuild --platform ios --clean --no-install
    - name: Cache CocoaPods downloads
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/CocoaPods
        key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
        restore-keys: pods-${{ runner.os }}-
    - name: pod install
      working-directory: ios
      env:
        EXPO_USE_SOURCE: '1'
        EXPO_USE_PRECOMPILED_MODULES: '0'
      run: pod install
    - name: Prove the patched camera source is what gets compiled
      working-directory: ios
      run: |
        set -euo pipefail
        echo "--- Podfile.lock entry"
        grep -n "ExpoCamera" Podfile.lock || true
        echo "--- any XCFramework in the pod"
        find Pods -maxdepth 3 -name "*.xcframework" -print || true
        echo "--- how the pod resolves"
        if [ -e Pods/ExpoCamera ]; then ls -la Pods/ExpoCamera || true; fi
        echo "--- does the Pods project reference the patched source?"
        if ! grep -q "CameraPhotoCapture.swift" Pods/Pods.xcodeproj/project.pbxproj; then
          echo "::error::Pods project does not compile CameraPhotoCapture.swift, so patches/ cannot take effect"
          exit 1
        fi
        if find Pods -maxdepth 3 -name "ExpoCamera.xcframework" | grep -q .; then
          echo "::error::ExpoCamera is linked as a prebuilt XCFramework, so the patched Swift is not compiled"
          exit 1
        fi
        echo "ExpoCamera compiles from the patched sources."
    - name: Import signing certificate
      env:
        CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
        CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
      run: |
        set -euo pipefail
        keychain="$RUNNER_TEMP/signing.keychain-db"
        keychain_password="$(openssl rand -base64 24)"
        cert="$RUNNER_TEMP/dist.p12"

        echo "$CERT_P12_BASE64" | base64 --decode > "$cert"

        security create-keychain -p "$keychain_password" "$keychain"
        # Stop the keychain relocking mid-build on the default 5-minute idle.
        security set-keychain-settings -lut 3600 "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        security import "$cert" -k "$keychain" -P "$CERT_PASSWORD" \
          -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
        # Without this, codesign prompts for keychain access and hangs the job.
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$keychain_password" "$keychain" > /dev/null
        # Prepend rather than replace, so the system roots stay searchable.
        security list-keychains -d user -s "$keychain" \
          $(security list-keychains -d user | tr -d '"')
        security default-keychain -s "$keychain"
        rm -f "$cert"

        echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
        echo "Identities available to codesign:"
        security find-identity -v -p codesigning "$keychain"
    - name: Install App Store Connect API key
      env:
        API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      run: |
        set -euo pipefail
        dir="$HOME/.appstoreconnect/private_keys"
        mkdir -p "$dir"
        key="$dir/AuthKey_${KEY_ID}.p8"
        # First tr: a base64 paste that arrived wrapped, or with a stray
        # newline, is still the right key. Second: CryptoKit matches the PEM
        # header line exactly, so one \r left by a Windows round-trip of the
        # .p8 is enough to make the whole document unparseable.
        printf '%s' "$API_KEY_P8_BASE64" | tr -d '[:space:]' | base64 --decode \
          | tr -d '\r' > "$key"
        chmod 600 "$key"
        # The Linux gate checked this already; repeated here because the gate
        # is skippable by re-running only this job.
        openssl pkey -in "$key" -noout 2>/dev/null || {
          echo "::error::APPSTORE_API_KEY_P8_BASE64 did not decode to a PEM private key."
          exit 1
        }
    - name: Install the distribution profile
      env:
        PROFILE_BASE64: ${{ secrets.APPLE_DIST_PROFILE_BASE64 }}
      run: |
        set -euo pipefail
        profile="$RUNNER_TEMP/dist.mobileprovision"
        plist="$RUNNER_TEMP/profile.plist"
        printf '%s' "$PROFILE_BASE64" | tr -d '[:space:]' | base64 --decode > "$profile"
        security cms -D -i "$profile" > "$plist"

        name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")"
        uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")"
        expires="$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$plist")"

        # The name is pasted into the export options plist further down, so a
        # markup character in it would produce invalid XML rather than an
        # obvious complaint. Apple allows them in profile names; nothing here
        # needs to.
        case "$name" in *[\<\>\&\"\']*)
          echo "::error::Provisioning profile name \"$name\" contains a character that cannot go into the export options plist. Rename the profile at developer.apple.com to plain text."
          exit 1 ;; esac

        for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                   "$HOME/Library/MobileDevice/Provisioning Profiles"; do
          mkdir -p "$dir"
          cp "$profile" "$dir/$uuid.mobileprovision"
        done
        rm -f "$plist"

        # The name, not the UUID: PROVISIONING_PROFILE_SPECIFIER takes either,
        # and the name is what the export options below have to repeat.
        echo "PROFILE_NAME=$name" >> "$GITHUB_ENV"
        echo "Installed \"$name\" ($uuid), expires $expires"
    - name: Point the app target at the profile
      env:
        TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: node tools/set-ios-signing.mjs
    - name: Archive
      env:
        CONFIGURATION: ${{ inputs.configuration || 'Release' }}
      run: |
        set -euo pipefail
        workspace="$(ls -d ios/*.xcworkspace | head -1)"
        scheme="$(basename "$workspace" .xcworkspace)"
        echo "Archiving $scheme ($CONFIGURATION) with \"$PROFILE_NAME\""
        xcodebuild archive \
          -workspace "$workspace" \
          -scheme "$scheme" \
          -configuration "$CONFIGURATION" \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -archivePath "$RUNNER_TEMP/app.xcarchive" \
          -derivedDataPath ios/build \
          OTHER_CODE_SIGN_FLAGS="--keychain=$SIGNING_KEYCHAIN" \
          -quiet
    - name: Export .ipa
      env:
        TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        set -euo pipefail
        bundle="$(node -p 'require("./app.json").expo.ios.bundleIdentifier')"

        # "app-store-connect" is the current spelling; Xcode 15.3 renamed it
        # from "app-store", which still works but warns. signingStyle has to
        # match the archive: automatic here would send the export back to
        # Apple for a profile it cannot mint, which is the whole reason this
        # release signs manually.
        cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>${TEAM_ID}</string>
          <key>signingStyle</key><string>manual</string>
          <key>signingCertificate</key><string>Apple Distribution</string>
          <key>provisioningProfiles</key>
          <dict>
            <key>${bundle}</key><string>${PROFILE_NAME}</string>
          </dict>
          <key>uploadSymbols</key><true/>
          <key>destination</key><string>export</string>
        </dict>
        </plist>
        PLIST

        xcodebuild -exportArchive \
          -archivePath "$RUNNER_TEMP/app.xcarchive" \
          -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
          -exportPath "$RUNNER_TEMP/export"

        ls -lh "$RUNNER_TEMP/export"
    - name: Upload to TestFlight
      env:
        KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      run: |
        set -euo pipefail
        ipa="$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)"
        echo "Uploading $(basename "$ipa") as build $BUILD_NUMBER"
        xcrun altool --upload-app -f "$ipa" -t ios \
          --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
        echo "Uploaded. App Store Connect processes the build before it shows"
        echo "up in TestFlight, which usually takes 5-15 minutes."
    - name: Remove credentials
      if: always()
      run: |
        security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
        rm -rf "$HOME/.appstoreconnect/private_keys"
        rm -f "$RUNNER_TEMP/dist.mobileprovision"
        rm -rf "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
               "$HOME/Library/MobileDevice/Provisioning Profiles"
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'testflight'
    concurrency:
      group: testflight-publish
      cancel-in-progress: false
  ota:
    name: Stage 3 · OTA update (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm
    - name: Install dependencies
      run: npm ci --legacy-peer-deps --no-audit --no-fund
    - name: Check the update configuration
      run: node tools/check-eas-updates.mjs
    - name: Report the runtime version
      env:
        EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        OTA_BRANCH: ${{ inputs.ota_branch }}
        OTA_MESSAGE: ${{ inputs.message }}
      run: |
        set -euo pipefail
        runtime="$(npx expo-updates runtimeversion:resolve --platform ios \
          | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).runtimeVersion')"
        echo "RUNTIME_VERSION=$runtime" >> "$GITHUB_ENV"
        {
          echo "### OTA update"
          echo
          echo "| | |"
          echo "|---|---|"
          echo "| Branch | \`$OTA_BRANCH\` |"
          echo "| Runtime version | \`$runtime\` |"
          echo "| Commit | \`${{ github.sha }}\` |"
          echo
          echo "Only builds whose runtime version is \`$runtime\` will take this update."
          echo "The iOS TestFlight run that produced the installed build prints the same value."
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Publish
      env:
        EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        OTA_BRANCH: ${{ inputs.ota_branch }}
        OTA_MESSAGE: ${{ inputs.message }}
      run: |
        set -euo pipefail
        npx eas-cli@latest update \
          --branch "$OTA_BRANCH" \
          --message "$OTA_MESSAGE" \
          --platform ios \
          --non-interactive
        echo
        echo "Published to branch $OTA_BRANCH at runtime version $RUNTIME_VERSION."
        echo "The app checks on launch and applies what it downloaded on the next"
        echo "one, so a phone takes the update at the second launch after this."
    needs:
    - check
    - screenshots
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'ota'
    concurrency:
      group: ota-publish-${{ inputs.ota_branch }}
      cancel-in-progress: false
  ios-build:
    name: Stage 3 · iOS simulator build (manual)
    needs:
    - check
    - screenshots
    - native-preflight
    runs-on: macos-26
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
    - name: Select Xcode 26 (Swift 6.2)
      run: |
        set -euo pipefail
        xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)" || true
        if [ -z "${xcode:-}" ]; then
          echo "::error::No Xcode 26 on this runner image. ExpoModulesJSI needs Swift 6.2; if the image has moved on to Xcode 27, widen the glob above after checking Expo supports it."
          ls -d /Applications/Xcode*.app || true
          exit 1
        fi
        echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
        "$xcode/Contents/Developer/usr/bin/xcodebuild" -version
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm
    - name: Install dependencies
      run: npm ci --legacy-peer-deps --no-audit --no-fund
    - name: Verify native patches reached node_modules
      run: bash tools/ci/verify-native-patches.sh
    - name: expo prebuild
      run: npx expo prebuild --platform ios --clean --no-install
    - name: Cache CocoaPods downloads
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/CocoaPods
        key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
        restore-keys: pods-${{ runner.os }}-
    - name: pod install
      working-directory: ios
      env:
        EXPO_USE_SOURCE: '1'
        EXPO_USE_PRECOMPILED_MODULES: '0'
      run: pod install
    - name: Prove the patched camera source is what gets compiled
      working-directory: ios
      run: |
        set -euo pipefail
        echo "--- Podfile.lock entry"
        grep -n "ExpoCamera" Podfile.lock || true
        echo "--- any XCFramework in the pod"
        find Pods -maxdepth 3 -name "*.xcframework" -print || true
        echo "--- how the pod resolves"
        if [ -e Pods/ExpoCamera ]; then ls -la Pods/ExpoCamera || true; fi
        echo "--- does the Pods project reference the patched source?"
        if ! grep -q "CameraPhotoCapture.swift" Pods/Pods.xcodeproj/project.pbxproj; then
          echo "::error::Pods project does not compile CameraPhotoCapture.swift, so patches/ cannot take effect"
          exit 1
        fi
        if find Pods -maxdepth 3 -name "ExpoCamera.xcframework" | grep -q .; then
          echo "::error::ExpoCamera is linked as a prebuilt XCFramework, so the patched Swift is not compiled"
          exit 1
        fi
        echo "ExpoCamera compiles from the patched sources."
    - name: Build
      run: |
        set -euo pipefail
        workspace="$(ls -d ios/*.xcworkspace | head -1)"
        scheme="$(basename "$workspace" .xcworkspace)"
        echo "Building $scheme (${{ inputs.configuration || 'Debug' }})"
        xcodebuild \
          -workspace "$workspace" \
          -scheme "$scheme" \
          -configuration "${{ inputs.configuration || 'Debug' }}" \
          -sdk iphonesimulator \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath ios/build \
          CODE_SIGNING_ALLOWED=NO \
          -quiet \
          build
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'ios-build'
  save-screenshots:
    name: Save screenshot artifacts (manual)
    needs:
    - check
    - screenshots
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'screenshots' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        persist-credentials: true
    - name: Fetch the rendered frames
      uses: actions/download-artifact@v4
      with:
        name: app-store-screenshots
        path: docs/app-store
    - name: Verify artifact source
      run: |
        set -euo pipefail
        test "$(cat docs/app-store/source-commit.txt)" = "$GITHUB_SHA"
        rm docs/app-store/source-commit.txt
    - name: Push them
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add docs/app-store
        if git diff --cached --quiet; then
          echo "The frames are unchanged; nothing to push." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        git commit -m 'chore: regenerate the App Store screenshots from the app'
        git push origin "HEAD:refs/heads/$TARGET_BRANCH"
      env:
        TARGET_BRANCH: ${{ github.ref_name }}
